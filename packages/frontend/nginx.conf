# Non-root nginx (see Dockerfile) can't bind :80 — listen on an
# unprivileged port and map it in docker-compose.yml instead.
#
# 127.0.0.11 is Docker's embedded DNS server, reachable from any
# container on a user-defined network. It's required here (rather than
# just naming "backend" directly in proxy_pass) because nginx resolves
# a literal proxy_pass hostname ONCE at config load — if the backend
# container isn't resolvable yet at that instant (container start
# order, a backend restart, a standalone run of this image), nginx
# refuses to start at all with "host not found in upstream", taking
# the entire static SPA down with it for no reason. Routing proxy_pass
# through a variable forces resolution to happen per-request via this
# resolver instead, so nginx boots and serves the SPA regardless of
# whether the backend happens to be reachable at that moment, and
# /api/ requests degrade to a 502 rather than crash-looping the
# container. Confirmed via `docker run` standalone (no backend
# service present): unpatched config fails to start; this one serves
# static content fine and only fails the /api/ path, as expected.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: hashed filenames from the Vite build, safe to
    # cache aggressively.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API to the backend service so the SPA can call
    # a same-origin relative path (VITE_API_BASE_URL=/api/v1 baked in
    # at build time) — no CORS involved in the containerized setup.
    #
    # proxy_pass with a variable upstream (needed above for lazy DNS
    # resolution) disables nginx's usual "strip the location prefix,
    # append the remainder" rewriting — with a static trailing /api/
    # here it silently forwarded every request as bare /api/ regardless
    # of the actual path (confirmed live: /api/v1/health/live became
    # "Cannot GET /api/" at the backend). $request_uri sidesteps that
    # entirely by forwarding the original path+query verbatim, so no
    # path rewriting depends on the disabled prefix-replacement.
    location /api/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing: fall back to index.html for anything
    # that isn't a real file or the API.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
