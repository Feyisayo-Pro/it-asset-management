name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (@iam/backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm workspaces: this installs every package in the monorepo
      # (root lockfile covers both @iam/backend and @iam/frontend).
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm --workspace @iam/backend run typecheck

      - name: Test
        run: npm --workspace @iam/backend run test

      - name: Build
        run: npm --workspace @iam/backend run build

  frontend:
    name: Frontend (@iam/frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm --workspace @iam/frontend run typecheck

      - name: Test
        run: npm --workspace @iam/frontend run test

      - name: Build
        run: npm --workspace @iam/frontend run build
