name: Keep backend awake

# Render's free tier spins the service down after ~15 minutes of no
# traffic; the next request then pays a cold-start cost (the backend
# has to boot NestJS and reconnect to Supabase), which can exceed a
# normal request timeout and show up to users as a login failure.
# Pinging the health endpoint well inside that 15-minute window keeps
# it warm. Runs on GitHub's infrastructure — not dependent on any
# local machine being on.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 30 https://iam-backend-9pj7.onrender.com/api/v1/health/live || \
          curl -fsS --max-time 30 https://iam-backend-9pj7.onrender.com/api/v1/health/live
