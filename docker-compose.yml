name: it-asset-management

# Copy .env.example to .env before running `docker compose up`.
# backend/frontend healthchecks come from the HEALTHCHECK instructions
# baked into their images (see packages/*/Dockerfile) — only postgres
# needs one defined here, since the upstream image doesn't ship one.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-iam} -d ${POSTGRES_DB:-iam}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: runs pending TypeORM migrations against the compiled
  # dist build, then exits. `backend` waits for it to succeed rather
  # than racing schema setup against the app boot.
  migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Set DATABASE_URL in .env to point the backend at a remote
      # Postgres (e.g. Supabase) instead of the bundled `postgres`
      # service below — it takes precedence over DB_HOST/DB_PORT/etc
      # when present. Remember to also set DB_SSL=true in that case.
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-iam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:-iam}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env (min 32 chars)}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-1209600}
      JWT_ISSUER: ${JWT_ISSUER:-iam-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-iam-frontend}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:8080/reset-password}
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
      THROTTLE_LIMIT_GLOBAL: ${THROTTLE_LIMIT_GLOBAL:-120}
      THROTTLE_LIMIT_AUTH: ${THROTTLE_LIMIT_AUTH:-10}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'packages/backend/dist/config/data-source.js']
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    restart: unless-stopped

volumes:
  postgres_data:
